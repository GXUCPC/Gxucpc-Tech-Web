name: Deploy Gxucpc Web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  # 必须写 self-hosted，呼叫自己的服务器

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build and Deploy Container
        run: |
          docker compose up -d --build
          docker image prune -f
